function resetSwipes(){if(swipeAnimating)return;if(!confirm('Začít výběr této skupiny znovu? Předchozí volby v ní se smažou.'))return;demoProducts.filter(p=>p.source===swipeSource).forEach(p=>delete state.productChoices[p.id]);swipeHistory=[];save();drawSwipe()}
function swipePointerDown(e){if(swipeAnimating||!e.isPrimary)return;const card=e.currentTarget;swipeStart={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,dy:0};card.classList.add('dragging');try{card.setPointerCapture(e.pointerId)}catch(err){}}
function swipePointerMove(e){if(!swipeStart||swipeStart.id!==e.pointerId||swipeAnimating)return;const card=e.currentTarget;const dx=e.clientX-swipeStart.x,dy=e.clientY-swipeStart.y;swipeStart.dx=dx;swipeStart.dy=dy;card.style.transform=`translate(${dx}px,${dy}px) rotate(${Math.max(-17,Math.min(17,dx*.065))}deg)`;const mode=swipeDirection(dx,dy,40);const stamp=document.getElementById('swipeStamp');if(stamp){stamp.className='swipe-stamp '+(mode||'');stamp.textContent=mode==='no'?'NEHLÍDAT':mode==='watch'?'HLÍDAT':mode==='alert'?'UPOZORNIT':'';stamp.style.opacity=mode?String(Math.min(1,Math.max(0,(Math.max(Math.abs(dx),-dy)-40)/75))):'0'}}
function swipeDirection(dx,dy,threshold){if(dy< -threshold&&-dy>Math.abs(dx)*1.25)return 'alert';if(Math.abs(dx)>threshold&&Math.abs(dx)>Math.abs(dy)*1.2)return dx>0?'watch':'no';return null}
function swipePointerUp(e){if(!swipeStart||swipeStart.id!==e.pointerId)return;const {dx,dy}=swipeStart;swipeStart=null;const mode=swipeDirection(dx,dy,125);if(mode){animateChoice(mode)}else{const card=e.currentTarget;card.classList.remove('dragging');card.style.transform='';const stamp=document.getElementById('swipeStamp');if(stamp)stamp.style.opacity='0'}}
function swipePointerCancel(e){swipeStart=null;const card=e.currentTarget;card.classList.remove('dragging');card.style.transform='';const stamp=document.getElementById('swipeStamp');if(stamp)stamp.style.opacity='0'}
function manualProduct(){modal(`<h2>Přidat produkt</h2><p class="small muted">Ručně přidané produkty se zatím ukládají jako demo hlídání, bez kontroly cen.</p><label class="field">Název produktu<input id="manualName" placeholder="Např. oblíbená káva"></label><label class="field">Režim<select id="manualMode"><option value="watch">Hlídat cenu</option><option value="alert">Hlídat a upozornit</option></select></label><button class="button full" onclick="saveManualProduct()">Přidat</button>`)}
function saveManualProduct(){const name=document.getElementById('manualName').value.trim(),mode=document.getElementById('manualMode').value;if(!name){toast('Vyplň název');return}const id='custom_'+Date.now();state.customProducts ||= [];state.customProducts.push({id,name,icon:'🛍️',price:'—',unit:'—',count:0,source:'manual'});state.productChoices[id]=mode;save();closeModal();render();toast('Produkt přidán (demo)')}
function plan(){const lists=state.shoppingLists||[];el.innerHTML=`<h2>Plán</h2><section class="card" style="background:#e8eee4"><p class="small">Do příští výplaty</p><div class="big" style="font-size:33px">${state.days} dní</div><p class="small muted">Povinné platby už jsou započítané v denním rozpočtu.</p></section><section class="card"><h3>Nadcházející platby</h3>${[['Telefon','3. listopadu',650],['Splátka úvěru','5. listopadu',7000],['Předplatné','8. listopadu',199]].map(a=>`<div class="category"><div class="grow"><b>${a[0]}</b><div class="small muted">${a[1]}</div></div><b>${fmt(a[2])}</b></div>`).join('')}<div class="note">Celková rezerva na čekající platby v demu je ${fmt(state.bills)}.</div></section><section class="card"><div class="row"><h3>Nákupní seznamy</h3><button class="ghost" onclick="newShoppingList()">+ Nový</button></div><p class="small muted" style="margin:9px 0 13px">Víc seznamů, žádný chaos.</p><button class="button secondary full" style="margin-bottom:10px" onclick="favoriteProducts()">♡ Oblíbené produkty (${state.favoriteProducts.length})</button>${lists.length?lists.map(l=>`<button class="transaction-row" onclick="openShoppingList('${l.id}')"><div class="emoji">🛒</div><div class="grow" style="text-align:left"><b>${escapeHTML(l.name)}</b><div class="small muted">${l.items.filter(i=>i.done).length} / ${l.items.length} položek</div></div><b>${fmt(l.items.filter(i=>!i.done).reduce((n,i)=>n+(Number(i.price)||0)*Math.max(1,Number(i.qty)||1),0))} ›</b></button>`).join(''):'<div class="note">Vytvoř si první seznam, třeba Potraviny nebo Domácnost.</div>'}<button class="button secondary full" style="margin-top:12px" onclick="newShoppingList()">+ Vytvořit seznam</button></section><section class="card"><div class="row"><h3>Moje rezervy</h3><button class="ghost" onclick="savings()">Spravovat ›</button></div><div class="row item"><span>Tento měsíc chci odložit</span><b>${fmt(state.monthlySaving)}</b></div><div class="row item"><span>Skutečná finanční rezerva</span><b>${fmt(state.totalReserve)}</b></div><div class="row item"><span>Pokud splním plán</span><b>${fmt(state.totalReserve+state.monthlySaving)}</b></div></section><section class="card"><h3>Kde můžeš ušetřit?</h3><p class="small muted">Prohlédni si skutečné položky z účtenek. Tipy na úspory přidáme, až budeme mít dost ověřených dat.</p><button class="button secondary full" onclick="savingsReview()">Prozkoumat nákupy ›</button></section><section class="card"><div class="row"><h3>Co když…?</h3><button class="ghost" onclick="scenario()">Vyzkoušet ›</button></div><p class="small muted" style="margin-top:9px">Ověř si dopad nákupu, příjmu nebo odložených peněz. Bez změny skutečného rozpočtu.</p>${state.scenarios.length?`<div class="line"></div>${state.scenarios.slice(-2).reverse().map(s=>`<div class="row item"><div class="grow"><b>${escapeHTML(s.name)}</b><div class="small muted">${s.type==='income'?'Příjem':s.type==='reserve'?'Odložení stranou':'Výdaj'} · ${fmt(s.amount)}</div></div><button class="ghost" onclick="openSavedScenario('${s.id}')">Detail ›</button></div>`).join('')}`:''}</section><section class="card"><div class="row"><h3>Úvěry a splátky</h3><button class="ghost" onclick="addDebt()">+ Přidat</button></div><p class="small muted" style="margin:9px 0">Přehled závazků a možnosti, jak je splácet chytřeji.</p>${state.debts.length?`<div class="row item"><span>Celkem zbývá</span><b>${fmt(state.debts.reduce((n,d)=>n+d.balance,0))}</b></div>${state.debts.map(d=>`<button class="transaction-row" onclick="debtDetail('${d.id}')"><div class="emoji">▤</div><div class="grow" style="text-align:left"><b>${escapeHTML(d.name)}</b><div class="small muted">${d.rate==null?"Úrok nezadán":d.rate+" % p. a."}${d.payment?" · splátka "+fmt(d.payment):""}</div></div><b>${fmt(d.balance)} ›</b></button>`).join('')}<button class="button secondary full" style="margin-top:10px" onclick="debtAdvice()">Co splatit jako první?</button><button class="button secondary full" style="margin-top:8px" onclick="debtScenario()">Co když splatím něco navíc?</button>`:'<div class="note">Přidej první úvěr nebo kartu. Můžeš zadat i vlastní zkušební údaje.</div>'}<button class="button secondary full" style="margin-top:12px" onclick="addDebt()">+ Přidat úvěr nebo kartu</button></section>`}
function scenario(){modal(`<h2>Co když…?</h2><p class="small muted">Zkus si změnu nanečisto. Tvůj skutečný rozpočet zůstane beze změny.</p><label class="field">Co plánuješ?<select id="scenarioType" onchange="updateScenarioPreview()"><option value="expense">Mimořádný výdaj</option><option value="income">Příjem navíc</option><option value="reserve">Odložit peníze stranou</option></select></label><label class="field">Název (nepovinný)<input id="scenarioName" maxlength="60" placeholder="Např. Nová pračka"></label><label class="field">Částka v Kč<input id="scenarioAmount" type="number" min="0" inputmode="decimal" placeholder="Např. 3000" oninput="updateScenarioPreview()"></label><div id="scenarioPreview" class="note"></div><button class="button full" onclick="saveScenario()">Uložit scénář</button><div class="note">Uložení scénáře neodečte peníze z účtu ani nevytvoří výdaj.</div>`);updateScenarioPreview()}
function updateScenarioPreview(){const out=document.getElementById('scenarioPreview');if(!out)return;const amount=Math.max(0,Number(document.getElementById('scenarioAmount').value)||0),type=document.getElementById('scenarioType').value;const available=state.balance-state.bills-state.monthlySaving;const after=available+(type==='income'?amount:-amount);const days=Math.max(1,Number(state.days)||1);out.innerHTML=`<div class="row"><span>Dnes můžeš utratit</span><b>${fmt(Math.max(0,Math.floor(available/days)))}</b></div><div class="row"><span>Po změně</span><b>${fmt(Math.max(0,Math.floor(after/days)))}</b></div>${after<0?`<p style="margin-top:12px">Plánované platby a rezerva by převýšily dostupné prostředky o <b>${fmt(-after)}</b>.</p>`:''}<p style="margin-top:12px">Orientační výpočet do další výplaty (${days} dní). Nezahrnuje úroky ani další budoucí změny.</p>`}
function saveScenario(){const amount=Number(document.getElementById('scenarioAmount').value);if(!(amount>0)||!Number.isFinite(amount)){toast('Zadej platnou částku');return}const type=document.getElementById('scenarioType').value;const name=document.getElementById('scenarioName').value.trim()||({expense:'Mimořádný výdaj',income:'Příjem navíc',reserve:'Odložené peníze'}[type]);state.scenarios.push({id:String(Date.now()),name,type,amount});save();closeModal();render();toast('Scénář uložen')}
function openSavedScenario(id){const s=state.scenarios.find(x=>x.id===id);if(!s)return;const remaining=state.balance-state.bills-state.monthlySaving+(s.type==='income'?s.amount:-s.amount);modal(`<h2>${escapeHTML(s.name)}</h2><p class="small muted">Uložený scénář · ${fmt(s.amount)}</p><div class="card hero"><p class="small">Denní rozpočet po změně</p><div class="big">${fmt(Math.max(0,Math.floor(remaining/Math.max(1,state.days))))}</div>${remaining<0?`<p class="small">Chybělo by ${fmt(-remaining)} na plánované platby a rezervu.</p>`:''}</div><p class="note">Pouze simulace. Skutečné finance se nemění.</p><button class="button secondary full" onclick="deleteScenario('${s.id}')">Smazat scénář</button>`)}
function deleteScenario(id){state.scenarios=state.scenarios.filter(x=>x.id!==id);save();closeModal();render();toast('Scénář smazán')}
const listPresets=['🛒 Potraviny','🧴 Drogerie','🏠 Domácnost','🎁 Dárky','🎄 Vánoce','🐾 Mazlíčci','👕 Oblečení','🛠️ Hobby','✈️ Cestování'];
function newShoppingList(){modal(`<h2>Nový nákupní seznam</h2><p class="small muted">Vyber si název nebo napiš vlastní.</p><div class="list-presets">${listPresets.map((x,i)=>`<button type="button" class="list-preset" onclick="selectListPreset(${i})">${x}</button>`).join('')}<button type="button" class="list-preset" onclick="selectListPreset(-1)">+ Vlastní</button></div><label class="field">Název seznamu<input id="listName" maxlength="55" placeholder="Napiš vlastní název…" oninput="syncListPreset()"></label><button class="button full" onclick="createShoppingList()">Vytvořit seznam</button>`)}
function selectListPreset(index){const field=document.getElementById('listName');field.value=index<0?'':listPresets[index].replace(/^[^ ]+ /,'');syncListPreset();if(index<0)field.focus()}
function syncListPreset(){const name=document.getElementById('listName').value.trim();document.querySelectorAll('.list-preset').forEach((b,i)=>b.classList.toggle('selected',i<listPresets.length&&listPresets[i].replace(/^[^ ]+ /,'')===name))}
function createShoppingList(){const name=document.getElementById('listName').value.trim();if(!name){toast('Zadej název seznamu');return}const id='list_'+Date.now();state.shoppingLists.push({id,name,items:[]});save();openShoppingList(id);render()}
const demoCatalog=[{name:'Ovesné mléko Oatly Barista 1 l',price:49,source:'Ukázková katalogová cena'},{name:'Ovesné mléko Alpro Barista 1 l',price:45,source:'Ukázková katalogová cena'},{name:'Ovesné mléko 1 l',price:39,source:'Ukázková katalogová cena'},{name:'Káva zrnková 1 kg',price:299,source:'Ukázková katalogová cena'},{name:'Káva mletá 250 g',price:109,source:'Ukázková katalogová cena'},{name:'Těstoviny 500 g',price:39,source:'Ukázková katalogová cena'},{name:'Rýže 1 kg',price:59,source:'Ukázková katalogová cena'},{name:'Chléb',price:null,source:'Cena neznámá'},{name:'Rajčata',price:null,source:'Cena neznámá'},{name:'Banány',price:null,source:'Cena neznámá'},{name:'Šampon 250 ml',price:89,source:'Ukázková katalogová cena'},{name:'Kapsičky pro kočku 12 ks',price:119,source:'Ukázková katalogová cena'}];
let chosenItem=null;
function knownProducts(){const h=state.favoriteProducts.map(i=>({name:i.name,price:i.price??null,source:'Oblíbené'}));state.shoppingLists.forEach(l=>l.items.forEach(i=>{if(!h.some(x=>x.name.toLowerCase()===i.name.toLowerCase()))h.push({name:i.name,price:i.price??null,source:i.source||'Z tvých seznamů'})}));return h}
function openShoppingList(id){const l=state.shoppingLists.find(x=>x.id===id);if(!l)return;const remaining=l.items.filter(x=>!x.done);const known=remaining.filter(x=>x.price!==null&&x.price!==undefined&&x.price!=='');const sum=known.reduce((n,x)=>n+Number(x.price)*Math.max(1,Number(x.qty)||1),0);modal(`<h2>${escapeHTML(l.name)}</h2><p class="small muted">${l.items.filter(x=>x.done).length} z ${l.items.length} položek hotovo</p>${l.items.length?`<div style="margin-top:14px">${l.items.map(i=>`<div class="category"><input aria-label="Označit jako koupené" type="checkbox" class="switch" ${i.done?'checked':''} onchange="toggleShoppingItem('${id}','${i.id}')"><div class="grow"><div style="${i.done?'text-decoration:line-through;opacity:.55':''}"><b>${escapeHTML(i.name)}</b>${i.qty>1?' × '+i.qty:''}</div><div class="small muted">${i.price!==null&&i.price!==undefined&&i.price!==''?fmt(i.price)+' / ks':'Cena neznámá'} · ${escapeHTML(i.source||'Ručně zadaná')}</div></div><button class="ghost" onclick="toggleFavoriteFromList('${id}','${i.id}')" aria-label="Oblíbené">${state.favoriteProducts.some(f=>f.name.toLowerCase()===i.name.toLowerCase())?'♥':'♡'}</button><button class="ghost" onclick="editShoppingPrice('${id}','${i.id}')" aria-label="Upravit cenu">✎</button><button class="ghost" aria-label="Odstranit položku" onclick="removeShoppingItem('${id}','${i.id}')">×</button></div>`).join('')}</div>`:'<div class="note">Zatím prázdný seznam. Přidej první položku.</div>'}<div class="line"></div><div class="row"><span>Zatím spočítáno</span><b>${fmt(sum)}</b></div><p class="small muted" style="margin:10px 0 16px">${known.length} z ${remaining.length} zbývajících položek má cenu.${known.length<remaining.length?' Skutečný nákup může stát více.':''} Ukázkové katalogové ceny nejsou živé nabídky.</p><button class="button full" onclick="newShoppingItem('${id}')">+ Přidat položku</button><button class="button secondary full" style="margin-top:9px" onclick="shoppingImpact('${id}')">Co udělá nákup s rozpočtem?</button><button class="ghost full" style="margin-top:8px" onclick="deleteShoppingList('${id}')">Smazat seznam</button>`)}
function editShoppingPrice(id,itemId){const i=state.shoppingLists.find(x=>x.id===id)?.items.find(x=>x.id===itemId);if(!i)return;modal(`<h2>Upravit cenu</h2><p class="small muted">${escapeHTML(i.name)}</p><label class="field">Cena za kus (Kč)<input id="editedPrice" type="number" min="0" step="0.01" value="${i.price??''}" placeholder="Cena neznámá"></label><button class="button full" onclick="const v=document.getElementById('editedPrice').value;iEditPrice('${id}','${itemId}',v)">Uložit</button>`)}
function iEditPrice(id,itemId,v){const i=state.shoppingLists.find(x=>x.id===id)?.items.find(x=>x.id===itemId);if(!i)return;i.price=v===''?null:Number(v);i.source=v===''?'Cena neznámá':'Ručně upravená';save();openShoppingList(id)}
function newShoppingItem(id){chosenItem=null;modal(`<h2>Nová položka</h2><label class="field">Co potřebuješ?<input id="itemName" maxlength="90" placeholder="Např. Ovesné mléko" autocomplete="off" oninput="itemSuggest()" onfocus="itemSuggest()"></label><div id="itemSuggestions" class="suggestions"></div><div class="two"><label class="field">Počet<input id="itemQty" type="number" min="1" step="1" value="1"></label><label class="field">Cena za kus (nepovinná)<input id="itemPrice" type="number" min="0" step="0.01" placeholder="Neznámá" oninput="chosenItem=null;updateItemSource()"></label></div><p class="small muted" id="itemSource">Pokud cenu neznáme, můžeš ji nechat prázdnou.</p><button class="button full" style="margin-top:14px" onclick="saveShoppingItem('${id}')">Přidat položku</button>`);itemSuggest()}
function itemSuggest(){const input=document.getElementById('itemName'),out=document.getElementById('itemSuggestions');if(!input||!out)return;const q=input.value.trim().toLocaleLowerCase('cs');const personal=knownProducts();const pool=[...personal,...demoCatalog.filter(x=>!personal.some(p=>p.name.toLowerCase()===x.name.toLowerCase()))];const matches=(q?pool.filter(p=>p.name.toLocaleLowerCase('cs').includes(q)):pool).slice(0,5);out.innerHTML=matches.map((p,i)=>`<button type="button" class="suggestion" onclick="chooseSuggestedItem(${i})"><span><b>${escapeHTML(p.name)}</b><br><span class="tag">${escapeHTML(p.source)}</span></span><b style="white-space:nowrap">${p.price===null?'—':fmt(p.price)}</b></button>`).join('')+(q?`<button type="button" class="suggestion" onclick="chooseGeneralItem()"><span>+ Přidat „${escapeHTML(input.value.trim())}“ bez konkrétní varianty</span></button>`:'');window.currentSuggestions=matches}
function chooseSuggestedItem(i){const p=window.currentSuggestions[i];if(!p)return;chosenItem=p;document.getElementById('itemName').value=p.name;document.getElementById('itemPrice').value=p.price??'';document.getElementById('itemSuggestions').innerHTML='';updateItemSource()}
function chooseGeneralItem(){chosenItem=null;document.getElementById('itemPrice').value='';document.getElementById('itemSuggestions').innerHTML='';updateItemSource()}
function updateItemSource(){const e=document.getElementById('itemSource');if(e)e.textContent=chosenItem?chosenItem.source+' · cenu můžeš opravit':'Vlastní položka · cenu můžeš doplnit později'}
function saveShoppingItem(id){const l=state.shoppingLists.find(x=>x.id===id);if(!l)return;const name=document.getElementById('itemName').value.trim(),qty=Number(document.getElementById('itemQty').value),raw=document.getElementById('itemPrice').value,price=raw===''?null:Number(raw);if(!name||!Number.isInteger(qty)||qty<1||(price!==null&&(!Number.isFinite(price)||price<0))){toast('Zkontroluj položku');return}l.items.push({id:'item_'+Date.now(),name,qty,price,source:chosenItem?.source|| (price===null?'Cena neznámá':'Ručně zadaná'),done:false});save();openShoppingList(id);toast('Položka přidána')}
function toggleShoppingItem(id,itemId){const l=state.shoppingLists.find(x=>x.id===id),i=l?.items.find(x=>x.id===itemId);if(!i)return;i.done=!i.done;save();openShoppingList(id);render()}
function removeShoppingItem(id,itemId){const l=state.shoppingLists.find(x=>x.id===id);if(!l)return;l.items=l.items.filter(x=>x.id!==itemId);save();openShoppingList(id);render()}
function deleteShoppingList(id){if(!confirm('Smazat tento nákupní seznam?'))return;state.shoppingLists=state.shoppingLists.filter(x=>x.id!==id);save();closeModal();render();toast('Seznam smazán')}
function shoppingImpact(id){const l=state.shoppingLists.find(x=>x.id===id);if(!l)return;const amount=l.items.filter(x=>!x.done).reduce((n,x)=>n+(Number(x.price)||0)*Math.max(1,Number(x.qty)||1),0);const remaining=state.balance-state.bills-state.monthlySaving-amount;modal(`<h2>Co když nakoupíš?</h2><p class="small muted">${escapeHTML(l.name)} · odhad ${fmt(amount)}</p><div class="card hero"><div class="row"><span>Dnes</span><b>${fmt(daily())}</b></div><div class="row"><span>Po nákupu</span><b>${fmt(Math.max(0,Math.floor(remaining/Math.max(1,state.days))))}</b></div></div>${remaining<0?`<p class="note">Plánované platby a rezerva by převýšily dostupné prostředky o ${fmt(-remaining)}.</p>`:'<p class="note">Odhad je orientační a skutečný rozpočet se nemění.</p>'}<button class="button secondary full" onclick="openShoppingList('${id}')">Zpět na seznam</button>`)}
function addDebt(){modal(`<h2>Přidat závazek</h2><p class="small muted">Vyplň jen to, co znáš. Údaje můžeš později doplnit.</p><label class="field">Typ závazku<select id="debtType" onchange="debtTypeChanged()"><option>Spotřebitelský úvěr</option><option>Kreditní karta</option><option>Kontokorent</option><option>Nákup na splátky</option><option>Jiný závazek</option></select></label><label class="field">Banka / poskytovatel<select id="debtBank"><option>MONETA Money Bank</option><option>Česká spořitelna</option><option>ČSOB</option><option>Raiffeisenbank</option><option>Komerční banka</option><option>Air Bank</option><option>Jiná banka</option></select></label><label class="field">Název (nepovinný)<input id="debtName" placeholder="Např. Moje karta"></label><div id="debtDynamic"></div><button class="button secondary full" onclick="debtHelp()">? Kde tyto údaje najdu?</button><div class="note">Nahrání a automatické čtení výpisu zatím není dostupné. Neukládej sem hesla ani přihlašovací údaje.</div><button class="button full" style="margin-top:12px" onclick="saveDebt()">Uložit závazek</button>`);debtTypeChanged()}
function debtTypeChanged(){const t=document.getElementById('debtType').value;document.getElementById('debtDynamic').innerHTML=`${t==='Kontokorent'?'<label class="field">Povolený limit (Kč, nepovinné)<input id="debtLimit" type="number" min="0" placeholder="20000"></label>':''}<label class="field">${t==='Kontokorent'?'Aktuálně čerpáš':t==='Kreditní karta'?'Aktuálně dlužíš':'Zbývá splatit'} (Kč)<input id="debtBalance" type="number" min="0" placeholder="12000"></label><label class="field">Úrok % p. a. (nepovinné)<input id="debtRate" type="number" min="0" step="0.01" placeholder="Doplním později"></label>${t==='Kontokorent'?'':`<label class="field">${t==='Kreditní karta'?'Minimální měsíční splátka':'Měsíční splátka'} (Kč, nepovinné)<input id="debtPayment" type="number" min="0" placeholder="Doplním později"></label>`}<label class="field">Poplatek za mimořádnou splátku (Kč, nepovinné)<input id="debtFee" type="number" min="0" value="0"></label>`}
function debtHelp(){const bank=document.getElementById('debtBank').value,type=document.getElementById('debtType').value;modal(`<h2>Kde najdu údaje?</h2><p class="small muted">${escapeHTML(bank)} · ${escapeHTML(type)}</p><div class="note"><b>Zbývající dluh</b><p>Hledej v detailu produktu nebo na posledním výpisu „Zůstatek“, „Dlužná částka“ či „Čerpáno“.</p></div><div class="note"><b>Úroková sazba</b><p>Najdeš ji obvykle ve smlouvě nebo sazebníku. Hledej „úrok p. a.“; RPSN není totéž.</p></div><div class="note"><b>Splátka</b><p>U úvěru ve splátkovém kalendáři, u kreditní karty na výpisu. Kontokorent často nemá pevnou měsíční splátku.</p></div><p class="note">Toto je obecný návod. Přesné kroky v aplikaci vybrané banky ještě nejsou ověřené.</p><button class="button full" onclick="addDebt()">Zpět k zadání</button>`)}
function saveDebt(){const type=document.getElementById('debtType').value,name=document.getElementById('debtName').value.trim()||type,balance=Number(document.getElementById('debtBalance').value),rateRaw=document.getElementById('debtRate').value,paymentRaw=document.getElementById('debtPayment')?.value,rate=rateRaw===''?null:Number(rateRaw),payment=paymentRaw==null||paymentRaw===''?null:Number(paymentRaw),fee=Number(document.getElementById('debtFee').value)||0;if(!(balance>0)||(rate!==null&&(!Number.isFinite(rate)||rate<0||rate>200))||(payment!==null&&payment<0)||fee<0){toast('Zkontroluj zadané částky');return}state.debts.push({id:'debt_'+Date.now(),name,type,bank:document.getElementById('debtBank').value,balance,rate,payment,fee,limit:Number(document.getElementById('debtLimit')?.value)||null});save();closeModal();render();toast('Závazek uložen')}
function debtDetail(id){const d=state.debts.find(x=>x.id===id);if(!d)return;modal(`<h2>${escapeHTML(d.name)}</h2><div class="card hero"><p class="small muted">Zbývá splatit</p><div class="big">${fmt(d.balance)}</div><p class="small">Úrok ${d.rate==null?"Úrok nezadán":d.rate+" % p. a."}${d.payment?" · splátka "+fmt(d.payment):""}/měsíc</p></div><p class="note">Uložené údaje jsou pouze orientační. Všechny minimální splátky je potřeba platit včas.</p><button class="button full" onclick="debtScenario('${d.id}')">Vyzkoušet mimořádnou splátku</button><button class="button secondary full" style="margin-top:9px" onclick="removeDebt('${d.id}')">Odstranit závazek</button>`)}
function removeDebt(id){if(!confirm('Odstranit tento závazek?'))return;state.debts=state.debts.filter(x=>x.id!==id);save();closeModal();render()}
function debtAdvice(){const a=[...state.debts].sort((x,y)=>(y.rate??-1)-(x.rate??-1)),b=[...state.debts].sort((x,y)=>x.balance-y.balance);modal(`<h2>Co splatit jako první?</h2><p class="small muted">Dvě možné strategie pro tvoje zadané závazky.</p><div class="card hero"><b>Nejdřív nejvyšší úrok</b><p class="small muted" style="margin:8px 0">Obvykle snižuje celkové zaplacené úroky.</p>${a.map((d,i)=>`<div class="row item"><span>${i+1}. ${escapeHTML(d.name)}</span><b>${d.rate==null?"Neznámý":d.rate+" %"}</b></div>`).join('')}</div><div class="card"><b>Nejdřív nejmenší dluh</b><p class="small muted" style="margin:8px 0">Pomáhá rychleji uzavírat jednotlivé závazky.</p>${b.map((d,i)=>`<div class="row item"><span>${i+1}. ${escapeHTML(d.name)}</span><b>${fmt(d.balance)}</b></div>`).join('')}</div><p class="note">Nejde o osobní finanční doporučení. Nejprve uhraď všechny povinné splátky, zvaž rezervu a ověř podmínky mimořádných splátek.</p><button class="button full" onclick="debtScenario()">Vyzkoušet mimořádnou splátku</button>`)}
function debtScenario(id){if(!state.debts.length){addDebt();return}const d=state.debts.find(x=>x.id===id)||state.debts[0];const limit=d.balance;modal(`<h2>Co když pošlu mimořádnou splátku?</h2><p class="small muted">Jednorázová splátka. Posuň částku a výsledek se hned přepočítá. Nic se neodečítá.</p><label class="field">Na který závazek?<select id="extraDebt" onchange="resetExtraRange()">${state.debts.map(x=>`<option value="${x.id}" ${x.id===d.id?'selected':''}>${escapeHTML(x.name)}</option>`).join('')}</select></label><label class="field">Mimořádná splátka (Kč)<input id="extraAmount" type="number" min="0" max="${d.balance}" value="${Math.min(5000,d.balance)}" oninput="syncExtra('input')"></label><input class="money-slider" id="extraSlider" type="range" min="0" max="${limit}" step="100" value="${Math.min(5000,d.balance)}" oninput="syncExtra('slider')"><div class="row small muted"><span>0 Kč</span><span id="extraMax">${fmt(d.balance)}</span></div><div id="debtScenarioResult" class="note"></div><button class="button secondary full" style="margin-top:14px" onclick="debtAdvice()">Porovnat strategie</button>`);updateDebtScenario()}
function resetExtraRange(){const d=state.debts.find(x=>x.id===document.getElementById('extraDebt').value);if(!d)return;const slider=document.getElementById('extraSlider');slider.max=d.balance;slider.step=d.balance<1000?10:100;slider.value=Math.min(5000,d.balance);document.getElementById('extraAmount').max=d.balance;document.getElementById('extraAmount').value=slider.value;document.getElementById('extraMax').textContent=fmt(d.balance);updateDebtScenario()}
function syncExtra(source){const d=state.debts.find(x=>x.id===document.getElementById('extraDebt').value);const input=document.getElementById('extraAmount'),slider=document.getElementById('extraSlider');const value=Math.max(0,Math.min(d.balance,Number(source==='slider'?slider.value:input.value)||0));if(source==='slider')input.value=value;else slider.value=value;updateDebtScenario()}
function estimateDebt(balance,rate,payment){let n=0,interest=0,b=balance;while(b>0.01&&n<600){const inc=b*rate/1200;if(payment<=inc)return null;interest+=inc;b=Math.max(0,b+inc-payment);n++}return n>=600?null:{months:n,interest}}
function updateDebtScenario(){const out=document.getElementById('debtScenarioResult');if(!out)return;const d=state.debts.find(x=>x.id===document.getElementById('extraDebt').value);if(!d)return;const extra=Math.min(d.balance,Math.max(0,Number(document.getElementById('extraAmount').value)||0)),applied=Math.min(extra,d.balance),before=d.rate!=null&&d.payment>0?estimateDebt(d.balance,d.rate,d.payment):null,after=d.rate!=null&&d.payment>0?estimateDebt(d.balance-applied,d.rate,d.payment):null,available=state.balance-state.bills-state.monthlySaving;out.innerHTML=`<b>Ilustrační dopad</b><div class="row item"><span>Zůstatek po splátce</span><b>${fmt(d.balance-applied)}</b></div>${before&&after?`<div class="row item"><span>Zkrácení splácení</span><b>${before.months-after.months} měsíců</b></div><div class="row item"><span>Úspora na úrocích*</span><b>${fmt(Math.max(0,before.interest-after.interest-(d.fee||0)))}</b></div>`:'<p style="margin-top:9px">Zadaná pravidelná splátka nepokrývá úrok nebo nelze odhadnout dobu splácení.</p>'}<div class="row item"><span>Volné peníze po splátce</span><b>${fmt(available-extra)}</b></div>${extra>available?'<p class="warn" style="margin-top:9px">Tato částka by zasáhla do plánovaných plateb nebo rezervy.</p>':''}<p style="margin-top:12px">*Zjednodušený model se stejnou měsíční splátkou, konstantním úrokem a bez nových čerpání. Poplatek za mimořádnou splátku: ${fmt(d.fee||0)} (zohledněn v orientační úspoře). Ověř skutečné podmínky u poskytovatele.</p>`}
function storesAndReceipts(){const stores=['BILLA','Lidl Plus','Kaufland','Albert','Tesco Clubcard','Globus','Penny','dm','Rossmann','Teta','Rohlík.cz','Košík.cz'];modal(`<h2>Obchody a účtenky</h2><p class="small muted">Propojení aplikací se připravuje. Zatím můžeš nahrát uloženou účtenku.</p>${stores.map(n=>`<div class="category"><div class="emoji">▧</div><div class="grow"><b>${n}</b><div class="small muted">Přímé propojení není aktivní</div></div><button class="ghost" onclick="storeInstructions('${n}')">Jak na to ›</button></div>`).join('')}<button class="button full" onclick="receiptOptions()">+ Nahrát účtenku</button>`)}
function storeInstructions(name){modal(`<h2>${escapeHTML(name)}</h2><p class="small muted">${name==='BILLA'?'BILLA zatím nenabízí digitální účtenky v aplikaci. Vyfoť papírový doklad.':name==='Lidl Plus'?'Lidl Plus → Účet → Účtenky → otevři účtenku → tři tečky → Sdílet.':name==='Globus'?'Můj Globus → Moje účtenky → vyber doklad → Sdílet účtenku (PDF).':'Pokud aplikace umožňuje sdílet elektronickou účtenku, ulož PDF nebo obrázek a nahraj ho do niloo.'}</p><div class="note">Přímé přihlášení a synchronizace s obchodem zatím nejsou dostupné. niloo. nikdy nepotřebuje heslo k tvému účtu v obchodě.</div><button class="button full" style="margin-top:15px" onclick="receiptOptions()">Nahrát účtenku</button><button class="button secondary full" style="margin-top:9px" onclick="storesAndReceipts()">Zpět k obchodům</button>`)}
function savings(){const max=Math.max(10000,Math.ceil((state.monthlySaving+10000)/5000)*5000);modal(`<h2>Moje rezervy</h2><p class="small muted">Plánované spoření a skutečně naspořené peníze jsou oddělené.</p><div class="card hero"><p class="small muted">Chci si tento měsíc odložit</p><label class="field"><input id="savingAmount" type="number" min="0" value="${state.monthlySaving}" oninput="syncSaving('input')"></label><input class="money-slider" id="savingSlider" type="range" min="0" max="${max}" step="100" value="${state.monthlySaving}" oninput="syncSaving('slider')"><div class="row small muted"><span>0 Kč</span><span>${fmt(max)}</span></div><div id="savingImpact" class="note"></div><button class="button full" onclick="saveMonthlySaving()">Uložit měsíční plán</button></div><div class="card"><p class="small muted">Skutečná finanční rezerva</p><div class="big" style="font-size:29px">${fmt(state.totalReserve)}</div><p class="small muted">Cíl ${fmt(state.reserveGoal)}</p><div class="bar"><div style="width:${Math.min(100,100*state.totalReserve/Math.max(1,state.reserveGoal))}%"></div></div><label class="field">Cíl rezervy (Kč)<input id="reserveGoal" type="number" min="1" value="${state.reserveGoal}"></label><button class="button secondary full" onclick="saveReserveGoal()">Uložit cíl</button><div class="line"></div><div class="row"><span>Pokud splním měsíční plán</span><b>${fmt(state.totalReserve+state.monthlySaving)}</b></div><button class="button secondary full" style="margin-top:12px" onclick="reserveTransfer()">+ Zaznamenat vklad nebo výběr</button></div><p class="note">Plánovanou částku nepřičítáme ke skutečné rezervě, dokud vklad nepotvrdíš. Peníze vyčleněné na samostatném účtu nezapočítej zároveň do běžného zůstatku.</p>`);updateSavingImpact()}
function syncSaving(src){const input=document.getElementById('savingAmount'),slider=document.getElementById('savingSlider');const val=Math.max(0,Number(src==='slider'?slider.value:input.value)||0);if(src==='slider')input.value=val;else {if(val>Number(slider.max))slider.max=Math.ceil(val/5000)*5000;slider.value=val}updateSavingImpact()}
function updateSavingImpact(){const target=document.getElementById('savingImpact');if(!target)return;const val=Math.max(0,Number(document.getElementById('savingAmount').value)||0),remaining=state.balance-state.bills-val;target.innerHTML=`<div class="row"><span>Dnes můžeš utratit</span><b>${fmt(daily())}</b></div><div class="row item"><span>Po změně spoření</span><b>${fmt(Math.max(0,Math.floor(remaining/Math.max(1,state.days))))}</b></div>${remaining<0?`<p>Plánované platby a spoření by převýšily dostupné peníze o ${fmt(-remaining)}.</p>`:''}`}
function saveMonthlySaving(){state.monthlySaving=Math.max(0,Number(document.getElementById('savingAmount').value)||0);save();closeModal();render();toast('Plán spoření uložen')}
function saveReserveGoal(){state.reserveGoal=Math.max(1,Number(document.getElementById('reserveGoal').value)||1);save();savings();toast('Cíl uložen')}
function reserveTransfer(){modal(`<h2>Zaznamenat pohyb rezervy</h2><p class="small muted">Skutečný vklad nebo výběr, ne jen plán.</p><label class="field">Typ pohybu<select id="reserveMoveType"><option value="in">Vklad do rezervy</option><option value="out">Výběr z rezervy</option></select></label><label class="field">Částka (Kč)<input id="reserveMoveAmount" type="number" min="0" placeholder="Např. 3000"></label><button class="button full" onclick="saveReserveTransfer()">Zaznamenat</button><p class="note">Záznam mění jen evidovanou rezervu v prototypu, ne bankovní zůstatek.</p>`)}
function saveReserveTransfer(){const amt=Number(document.getElementById('reserveMoveAmount').value),type=document.getElementById('reserveMoveType').value;if(!(amt>0)||(type==='out'&&amt>state.totalReserve)){toast('Zkontroluj částku');return}state.totalReserve+=type==='in'?amt:-amt;state.reserveEvents.push({type,amount:amt,date:new Date().toISOString()});save();savings();toast('Pohyb rezervy zaznamenán')}
const faqData=[
['Jak se počítá můj denní rozpočet?','niloo. vychází z peněz na účtech, odečítá čekající platby a rezervu. Zbytek rozdělí mezi dny do další výplaty. Přesný výpočet otevřeš klepnutím na částku na Přehledu.'],
['Jak přidám účtenku?','V záložce Výdaje otevři Archiv účtenek a zvol Přidat účtenku. Můžeš ji vyfotit nebo nahrát jako PDF či obrázek.'],
['Jak rozdělím výdaj do kategorií?','Otevři transakci a vyber možnost rozdělení výdaje. Přidej kategorie a částky tak, aby jejich součet odpovídal celému nákupu.'],
['Jak připojím banku?','Na Přehledu klepni na Na účtech a vyber Připojit banku. Skutečné bankovní propojení zatím připravujeme.']
];
function helpCenter(){modal(`<h2>Jak ti můžeme pomoci?</h2><label class="field">Najít odpověď<input id="faqSearch" type="search" placeholder="S čím potřebuješ poradit?" oninput="filterFAQ()" autocomplete="off"></label><p class="small muted">Časté otázky</p><div id="faqResults"></div><div class="note" style="margin-top:18px"><b>💬 Zeptej se niloo.</b><p style="margin-top:7px">AI asistent se připravuje. Zatím ti poradí otázky výše.</p></div>`);filterFAQ()}
function filterFAQ(){const input=document.getElementById('faqSearch');const target=document.getElementById('faqResults');if(!input||!target)return;const q=input.value.toLocaleLowerCase('cs').trim();const filtered=faqData.filter(([a,b])=>(a+' '+b).toLocaleLowerCase('cs').includes(q));target.innerHTML=filtered.length?filtered.map(([a,b])=>`<details class="faq-item"><summary>${escapeHTML(a)}</summary><p class="small muted">${escapeHTML(b)}</p></details>`).join(''):'<p class="note">Nic jsme nenašli. Zkus jiné slovo.</p>'}
function modal(html){document.getElementById('overlay').innerHTML=`<div class="sheetbg" onclick="closeModal(event)"><div class="sheet" onclick="event.stopPropagation()">${html}<button class="ghost full" style="margin-top:15px" onclick="closeModal()">Zavřít</button></div></div>`}function closeModal(e){if(e&&e.target.className!=='sheetbg')return;document.getElementById('overlay').innerHTML='';if(state.tab==='deals')render()}function showBudget(){modal(`<h2>Jak počítáme tvůj rozpočet</h2><div class="row"><span>Aktuálně na účtech</span><b>${fmt(state.balance)}</b></div><div class="row"><span>Čekající povinné platby</span><b>−${fmt(state.bills)}</b></div><div class="row"><span>Chci si tento měsíc odložit</span><b>−${fmt(state.monthlySaving)}</b></div><div class="line"></div><div class="row"><span>Volné prostředky</span><b>${fmt(spendable())}</b></div><div class="row"><span>Počet dní do výplaty</span><b>${state.days}</b></div><div class="line"></div><div class="row"><h3>Na jeden den</h3><h2>${fmt(daily())}</h2></div><label class="field">Dní do příští výplaty<input type="number" min="1" max="365" id="days" value="${state.days}"></label><label class="field">Chci si tento měsíc odložit (Kč)<input type="number" min="0" id="reserve" value="${state.monthlySaving}"></label><button class="button full" onclick="updateBudget()">Uložit změny</button><p class="note">Jde o zjednodušený demonstrační výpočet. V reálné aplikaci se částky dopočítají z propojených účtů a plánovaných plateb.</p>`)}function updateBudget(){state.days=Math.max(1,Number(document.getElementById('days').value)||1);state.monthlySaving=Math.max(0,Number(document.getElementById('reserve').value)||0);save();closeModal();render();toast('Rozpočet přepočítán')}
function openAdd(){modal(`<h2>Co chceš přidat?</h2><button class="button secondary full" style="margin-bottom:10px" onclick="entry('expense')">− Přidat výdaj</button><button class="button secondary full" style="margin-bottom:10px" onclick="entry('income')">+ Přidat příjem</button><button class="button secondary full" onclick="receiptOptions()">▧ Přidat účtenku</button>`)}function entry(type){modal(`<h2>${type==='income'?'Nový příjem':'Nový výdaj'}</h2><label class="field">Popis (nepovinný)<input id="entryname" placeholder="Např. Nákup"></label><label class="field">Částka (Kč)<input id="entryamount" type="number" inputmode="decimal" min="0" placeholder="0"></label>${type==='expense'?`<label class="field">Kategorie<select id="entrycat">${categories.map(c=>`<option>${c}</option>`).join('')}</select></label>`:''}<button class="button full" onclick="addEntry('${type}')">Uložit</button>`)}function addEntry(type){const name=document.getElementById('entryname').value.trim();const amount=Number(document.getElementById('entryamount').value);if(!(amount>0)){toast('Vyplň částku');return}const category=type==='income'?'Příjem':document.getElementById('entrycat').value;state.transactions.unshift({id:Date.now(),name:name||(type==='income'?'Příjem':category),amount:type==='income'?amount:-amount,category,date:'Právě teď'});state.balance+=type==='income'?amount:-amount;save();closeModal();render();toast('Položka uložena')}
function accounts(){modal(`<h2>Moje účty</h2><p class="small muted">Přehled účtů a jejich propojení.</p><div class="category"><span class="emoji">⌂</span><div class="grow"><b>Ukázkový účet</b><div class="small muted">Demo data · není propojen s bankou</div></div><b>${fmt(state.balance)}</b></div><button class="button full" onclick="bankConnect()">+ Připojit banku</button><p class="note">niloo. zatím používá ukázkové údaje. Skutečné propojení bank připravujeme.</p>`)}
function bankConnect(){modal(`<h2>Připojit banku</h2><p class="small muted">Tady si později bezpečně vybereš banku a povolíš načítání zůstatků a transakcí.</p><div class="note">Připojení zatím není aktivní. niloo. nyní nevyžaduje bankovní přihlašovací údaje a žádná data z banky nenačítá.</div><button class="button secondary full" onclick="accounts()">Zpět na moje účty</button>`)}
function receiptOptions(){modal(`<h2>Přidat účtenku</h2><p class="small muted">Vyber, odkud chceš doklad přidat.</p><button class="button secondary full" style="margin-top:14px" onclick="receipt();document.getElementById('cameraInput').click()">📷 Vyfotit účtenku</button><button class="button secondary full" style="margin-top:9px" onclick="receipt();document.getElementById('galleryInput').click()">▧ Nahrát PDF nebo fotografii</button><button class="button secondary full" style="margin-top:9px" onclick="appImport()">↗ Z jiné aplikace</button><button class="button secondary full" style="margin-top:9px" onclick="emailImport()">✉ Účtenky z e-mailu</button>`)}
function appImport(){modal(`<h2>Účtenka z jiné aplikace</h2><p class="small muted">Pokud obchod umožňuje stáhnout účtenku jako PDF nebo obrázek, ulož ji do souborů či fotek a nahraj do niloo..</p><button class="button full" onclick="receipt();document.getElementById('galleryInput').click()">Vybrat uložený doklad</button><div class="note">Přímé sdílení z aplikací do niloo. zatím není aktivní. Připravíme ho pro budoucí iPhone aplikaci.</div>`)}
function emailImport(){modal(`<h2>Účtenky z e-mailu</h2><p class="small muted">V budoucnu bude možné přeposílat účtenky na osobní adresu niloo. nebo dobrovolně propojit e-mail.</p><div class="note">Automatické načítání e-mailů zatím není aktivní. Teď můžeš přílohu z e-mailu uložit jako PDF nebo obrázek a nahrát ji ručně.</div><button class="button full" onclick="receipt();document.getElementById('galleryInput').click()">Nahrát přílohu z e-mailu</button>`)}
function oldReceipt(){modal(`<h2>Přidat účtenku</h2><p class="muted small">Vyber fotografii nebo PDF. Toto demo soubor neodesílá ani neanalyzuje.</p><label class="field">Vybrat soubor<input type="file" accept="image/*,.pdf" onchange="document.getElementById('selected').textContent=this.files[0]?.name||''"></label><p class="note" id="selected">Automatické rozpoznávání položek a párování s bankou přidáme po napojení služeb.</p>`)}let pendingPhotos=[];let pendingItems=[];let pendingOCRText='';let receiptOCRBusy=false;
function receipt(){pendingPhotos=[];pendingItems=[];pendingOCRText='';receiptForm()}
function receiptForm(){modal(`<h2 style="margin-bottom:14px">Nová účtenka</h2>
<div id="ocrProgress" style="display:none;margin:0 0 16px;padding:15px;background:#f3edfa;border-radius:16px" role="status" aria-live="polite"><b style="display:block;margin-bottom:9px;color:#513276">✦ Pracuji na účtence</b><div style="height:8px;background:#e3d7f0;border-radius:20px;overflow:hidden"><div class="niloo-progress-bar" style="height:100%;width:35%;background:#9875c8;border-radius:20px;animation:niloo-progress 1.5s ease-in-out infinite alternate"></div></div><p id="ocrStage" class="small muted" style="margin:9px 0 0">Čtu účtenku…</p></div>
<div id="receiptUploadActions" class="actionrow" style="margin:4px 0 12px"><button class="button secondary" onclick="document.getElementById('cameraInput').click()">📷 Vyfotit</button><button class="button secondary" onclick="document.getElementById('galleryInput').click()">▧ Vybrat soubor</button></div>
<input class="hidden" id="cameraInput" type="file" accept="image/*" capture="environment" onchange="receiveFiles(this.files)"><input class="hidden" id="galleryInput" type="file" accept="image/*,application/pdf,.pdf" multiple onchange="receiveFiles(this.files)">
<div id="photoPreview"></div><div id="ocrStatus" class="small muted" style="margin:5px 0 10px" aria-live="polite"></div><button id="ocrRetry" class="ghost" style="display:none;margin-bottom:12px" onclick="analyzeReceipt()">↻ Zkusit znovu</button>
<div class="niloo-receipt-meta"><label class="niloo-meta-field"><span>Obchod</span><input id="receiptName" placeholder="Obchod" aria-label="Obchod"></label><label class="niloo-meta-field niloo-date-field"><span>Datum</span><span id="receiptDateDisplay">${new Date().toLocaleDateString('cs-CZ',{day:'2-digit',month:'2-digit',year:'2-digit'}).replace(/\s/g,'')}</span><input type="date" id="receiptDate" aria-label="Datum nákupu" value="${new Date().toISOString().slice(0,10)}" onchange="updateReceiptDateDisplay()"></label></div>
<div id="ocrReview"></div><details class="niloo-optional"><summary>Další možnosti</summary><div style="padding-top:12px"><label class="field">Přiřadit k výdaji<select id="receiptTx"><option value="">Zatím bez přiřazení</option>${state.transactions.filter(t=>t.amount<0).map(t=>`<option value="${t.id}">${escapeHTML(t.name)} · ${fmt(-t.amount)}</option>`).join('')}</select></label><label class="field">Výrobek se zárukou<input id="receiptProduct" placeholder="Např. Pračka"></label><label class="field">Záruka do<input type="date" id="receiptWarranty"></label></div></details><button id="receiptSaveButton" class="button full" onclick="saveReceipt()">Uložit účtenku</button>`);updatePhotoPreview();renderOCRReview()}
function updateReceiptDateDisplay(){const e=document.getElementById('receiptDate'),v=document.getElementById('receiptDateDisplay');if(e&&v&&e.value){const [y,m,d]=e.value.split('-');v.textContent=d+'.'+m+'.'+y.slice(-2)}}

async function receiveFiles(files){if(receiptOCRBusy){toast("Počkej na dokončení rozpoznávání");return;}for(const f of [...files]){if(f.type==='application/pdf'||f.name.toLowerCase().endsWith('.pdf')){if(f.size>15000000){toast('PDF přesahuje limit 15 MB');continue}try{const data=await fileToDataURL(f);pendingPhotos.push({name:f.name,type:'pdf',data})}catch(e){toast('PDF se nepodařilo načíst')}continue}if(!f.type.startsWith('image/'))continue;try{let data=await compressPhoto(f);pendingPhotos.push({name:f.name,type:'image',data})}catch(e){toast('Fotografii se nepodařilo načíst')}}updatePhotoPreview();if(pendingPhotos.length)await analyzeReceipt()}
function compressPhoto(f){return new Promise((resolve,reject)=>{const img=new Image();const url=URL.createObjectURL(f);img.onload=()=>{const scale=Math.min(1,1000/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);resolve(c.toDataURL('image/jpeg',.65))};img.onerror=()=>{URL.revokeObjectURL(url);reject()};img.src=url})}
function updatePhotoPreview(){const e=document.getElementById('photoPreview');if(!e)return;e.innerHTML=pendingPhotos.length?`<div class="niloo-file-list">${pendingPhotos.map((p,i)=>`<div class="niloo-file-row"><span class="niloo-file-icon">${p.type==='pdf'?'▧':'▣'}</span><span class="niloo-file-name">${escapeHTML(p.name)}</span><button class="ghost" aria-label="Odebrat soubor" onclick="if(receiptOCRBusy)return;pendingPhotos.splice(${i},1);pendingItems=[];pendingOCRText='';updatePhotoPreview();renderOCRReview()">×</button></div>`).join('')}</div>`:'';const actions=document.getElementById('receiptUploadActions');if(actions)actions.style.display=pendingPhotos.length?'none':'flex'}

function receiptDB(){return new Promise((resolve,reject)=>{const q=indexedDB.open('niloo-receipt-files',1);q.onupgradeneeded=()=>q.result.createObjectStore('files');q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)})}
async function putReceiptFile(key,data){const db=await receiptDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(data,key);tx.oncomplete=()=>{db.close();resolve()};tx.onerror=()=>{db.close();reject(tx.error)}})}
async function getReceiptFile(key){const db=await receiptDB();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readonly');const q=tx.objectStore('files').get(key);q.onsuccess=()=>{db.close();resolve(q.result)};q.onerror=()=>{db.close();reject(q.error)}})}
async function deleteReceiptFiles(id){try{const db=await receiptDB();const tx=db.transaction('files','readwrite');const st=tx.objectStore('files');const r=state.receipts.find(x=>x.id===id);for(const p of r?.photos||[])if(p.fileKey)st.delete(p.fileKey);tx.oncomplete=()=>db.close()}catch(e){}}
async function openReceiptFile(key,name){try{const data=await getReceiptFile(key);if(!data){toast('Soubor není v tomto prohlížeči');return}const a=document.createElement('a');a.href=data;a.download=name||'uctenka';document.body.appendChild(a);a.click();a.remove()}catch(e){toast('Soubor se nepodařilo otevřít')}}
async function saveReceipt(){if(receiptOCRBusy){toast('Počkej na dokončení rozpoznávání');return}const name=document.getElementById('receiptName').value.trim()||'Účtenka';if(!pendingPhotos.length){toast('Nejdřív přidej fotografii nebo soubor');return}const id=Date.now();const photos=pendingPhotos.map((p,i)=>({name:p.name,type:p.type,fileKey:id+'_'+i}));try{for(let i=0;i<pendingPhotos.length;i++)await putReceiptFile(photos[i].fileKey,pendingPhotos[i].data)}catch(e){toast('Prohlížeč nedovolil uložit soubor. Zkontroluj volné místo.');return}const reviewed=readReviewedItems();if(pendingOCRText&&!reviewed.length&&!confirm('Nebyly rozpoznány žádné položky. Opravdu chceš účtenku uložit bez položek?'))return;if(pendingOCRText&&reviewed.length===1&&/ČÁSTKA|CELKEM|TOTAL|CZK/i.test(reviewed[0].name)){toast('Celková částka není produkt. Zkontroluj položky.');return}const r={id,name,date:document.getElementById('receiptDate').value,items:reviewed,transactionId:Number(document.getElementById('receiptTx').value)||null,warranty:document.getElementById('receiptWarranty').value,warrantyProduct:document.getElementById('receiptProduct').value.trim(),photos};state.receipts.unshift(r);save();pendingPhotos=[];pendingItems=[];closeModal();render();toast('Účtenka uložena do archivu')}

function receiptArchive(){modal(`<h2>Archiv účtenek</h2><label class="field">Vyhledat doklad<input id="receiptSearch" placeholder="Obchod nebo název" oninput="filterReceipts()"></label><div id="receiptResults"></div><button class="button secondary full" onclick="receiptOptions()">+ Přidat účtenku</button>`);filterReceipts()}
function filterReceipts(){const q=(document.getElementById('receiptSearch')?.value||'').toLowerCase();const out=document.getElementById('receiptResults');if(!out)return;const list=state.receipts.filter(r=>r.name.toLowerCase().includes(q)||r.date.includes(q));out.innerHTML=list.length?list.map(r=>`<div class="category" onclick="receiptDetail(${r.id})" style="cursor:pointer"><div class="emoji">▧</div><div class="grow"><b>${escapeHTML(r.name)}</b><div class="small muted">${r.date} · ${r.photos.length} souborů${r.warranty?' · Záruka do '+r.warranty:''}</div></div><span>›</span></div>`).join(''):'<p class="note">Zatím žádné účtenky.</p>'}
function receiptDetail(id){const r=state.receipts.find(x=>x.id===id);if(!r)return;const tx=state.transactions.find(t=>t.id===r.transactionId);modal(`<h2>${escapeHTML(r.name)}</h2><p class="small muted">${r.date}${r.warranty?' · Záruka do '+r.warranty:''}</p><div class="thumbs">${r.photos.map(p=>p.fileKey?`<button class="button secondary" onclick="openReceiptFile('${p.fileKey}','${escapeHTML(p.name)}')">📎 ${escapeHTML(p.name)}</button>`:p.data&&p.type==='pdf'?`<a class="button secondary" style="text-decoration:none;display:inline-block" href="${p.data}" download="${escapeHTML(p.name)}">📄 Stáhnout PDF</a>`:p.data?`<a href="${p.data}" target="_blank"><img class="receipt-thumb" src="${p.data}" alt="Účtenka"></a>`:`<div class="note">📄 ${escapeHTML(p.name)} – PDF nebylo ve starší verzi uloženo</div>`).join('')}</div><p class="small">${tx?'Přiřazeno k výdaji: '+escapeHTML(tx.name)+' · '+fmt(-tx.amount):'Doklad zatím není přiřazen k výdaji.'}</p><button class="button secondary full" style="margin-top:15px" onclick="receiptItems(${r.id})">🧺 Položky a kategorie (${(r.items||[]).length})</button><button class="button secondary full" style="margin-top:9px" onclick="editReceiptWarranty(${r.id})">🛡 Upravit záruku</button><button class="button secondary full" style="margin-top:9px" onclick="deleteReceipt(${r.id})">Odstranit doklad</button>`)}
function deleteReceipt(id){deleteReceiptFiles(id);state.receipts=state.receipts.filter(r=>r.id!==id);save();receiptArchive();toast('Doklad odstraněn')}
function transactionDetail(id){const t=state.transactions.find(x=>x.id===id);if(!t)return;const rs=state.receipts.filter(r=>r.transactionId===id);modal(`<h2>${escapeHTML(t.name)}</h2><div class="big" style="font-size:32px">${fmt(Math.abs(t.amount))}</div><p class="small muted">${t.date} · ${escapeHTML(t.category)}</p>${t.amount<0?`<div class="line"></div><h3>Kategorie výdaje</h3>${(t.parts||[]).map(p=>`<div class="row item"><span>${escapeHTML(p.category)}</span><b>${fmt(p.amount)}</b></div>`).join('')}<button class="button secondary full" style="margin:12px 0" onclick="editTransaction(${id})">Upravit / rozdělit do kategorií</button>`:''}<div class="line"></div><h3>Přiložené účtenky</h3>${rs.length?rs.map(r=>`<div class="category" onclick="receiptDetail(${r.id})" style="cursor:pointer"><span>▧</span><div class="grow">${escapeHTML(r.name)}</div><span>›</span></div>`).join(''):'<p class="note">K této transakci zatím není přiložená účtenka.</p>'}<button class="button secondary full" style="margin-top:15px" onclick="receipt();document.getElementById('receiptTx').value='${id}'">+ Přiložit účtenku</button>`)}
function categoryDetail(c){modal(`<h2>${c}</h2><div class="big" style="font-size:32px">${fmt(catTotal(c))}</div>${state.transactions.filter(t=>t.amount<0&&(t.parts||[]).some(p=>p.category===c)).map(t=>`<div class="category"><div class="grow"><b>${escapeHTML(t.name)}</b><div class="small muted">${t.date}</div></div><b>${fmt((t.parts||[]).filter(p=>p.category===c).reduce((a,p)=>a+p.amount,0))}</b></div>`).join('')}<button class="button secondary full" onclick="limits('${c}')">${state.limits[c]?'Upravit limit':'Nastavit limit'}</button>`)}function limits(selected='Potraviny'){modal(`<h2>Dobrovolný limit</h2><p class="small muted">Limity slouží jen pro přehled, bez upozornění a výčitek.</p><label class="field">Kategorie<select id="limitcat" onchange="document.getElementById('limitamount').value=state.limits[this.value]||''">${categories.map(c=>`<option ${selected===c?'selected':''}>${c}</option>`).join('')}</select></label><label class="field">Měsíční limit (Kč)<input type="number" id="limitamount" min="0" value="${state.limits[selected]||''}" placeholder="Např. 2000"></label><button class="button full" onclick="saveLimit()">Uložit limit</button><p class="small muted" style="margin-top:12px">Zadáním 0 limit odstraníš.</p>`)}function saveLimit(){const c=document.getElementById('limitcat').value,n=Number(document.getElementById('limitamount').value);if(n>0)state.limits[c]=n;else delete state.limits[c];save();closeModal();render();toast('Limit upraven')}

function manageCategories(){modal(`<h2>Spravovat kategorie</h2><p class="small muted">Vytvářej vlastní hlavní kategorie. Změny se promítnou do přehledů.</p><div style="margin-top:12px">${categories.map((c,i)=>`<div class="category"><div class="grow"><b>${escapeHTML(c)}</b>${state.hiddenCategories.includes(c)?'<div class="small muted">Skrytá v přehledu</div>':''}</div><button class="ghost" onclick="renameCategory(${i})">Upravit</button><button class="ghost" onclick="toggleCategory(${i})">${state.hiddenCategories.includes(c)?'Zobrazit':'Skrýt'}</button></div>`).join('')}</div><button class="button full" style="margin-top:16px" onclick="newCategory()">+ Přidat kategorii</button><button class="button secondary full" style="margin-top:8px" onclick="mergeCategories()">Sloučit kategorie</button>`)}
function newCategory(){modal(`<h2>Nová kategorie</h2><label class="field">Název<input id="newCat" maxlength="45" placeholder="Např. Alkohol"></label><button class="button full" onclick="addCategory()">Přidat kategorii</button>`)}
function addCategory(){const name=document.getElementById('newCat').value.trim();if(!name||categories.some(c=>c.toLowerCase()===name.toLowerCase())){toast('Zadej nový jedinečný název');return}categories.push(name);save();manageCategories();render();toast('Kategorie přidána')}
function renameCategory(i){const old=categories[i];modal(`<h2>Upravit kategorii</h2><label class="field">Název<input id="renameCat" maxlength="45" value="${escapeHTML(old)}"></label><button class="button full" onclick="saveRename(${i})">Uložit název</button>`)}
function replaceCategory(old,n){state.transactions.forEach(t=>{if(t.category===old)t.category=n;(t.parts||[]).forEach(p=>{if(p.category===old)p.category=n});if(t.parts){const merged={};t.parts.forEach(p=>merged[p.category]=(merged[p.category]||0)+p.amount);t.parts=Object.entries(merged).map(([category,amount])=>({category,amount}))}});if(state.limits[old]){state.limits[n]=(state.limits[n]||0)+state.limits[old];delete state.limits[old]}state.hiddenCategories=state.hiddenCategories.filter(c=>c!==old)}
function saveRename(i){const n=document.getElementById('renameCat').value.trim(),old=categories[i];if(!n||(n!==old&&categories.some(c=>c.toLowerCase()===n.toLowerCase()))){toast('Zadej jedinečný název');return}replaceCategory(old,n);categories[i]=n;save();render();manageCategories();toast('Kategorie přejmenována')}
function toggleCategory(i){const c=categories[i];state.hiddenCategories=state.hiddenCategories.includes(c)?state.hiddenCategories.filter(x=>x!==c):[...state.hiddenCategories,c];save();render();manageCategories()}
function mergeCategories(){modal(`<h2>Sloučit kategorie</h2><p class="small muted">Výdaje ze zdrojové kategorie se přesunou do cílové.</p><label class="field">Sloučit kategorii<select id="mergeFrom">${categories.map(c=>`<option>${escapeHTML(c)}</option>`).join('')}</select></label><label class="field">Do kategorie<select id="mergeTo">${categories.map(c=>`<option>${escapeHTML(c)}</option>`).join('')}</select></label><button class="button full" onclick="saveMerge()">Sloučit kategorie</button>`)}
function saveMerge(){const a=document.getElementById('mergeFrom').value,b=document.getElementById('mergeTo').value;if(a===b){toast('Vyber dvě různé kategorie');return}if(!confirm(`Sloučit „${a}“ do „${b}“?`))return;replaceCategory(a,b);categories.splice(categories.indexOf(a),1);save();render();manageCategories();toast('Kategorie sloučeny')}
let editParts=[];let editId=null;
function editTransaction(id){const t=state.transactions.find(t=>t.id===id);if(!t||t.amount>=0)return;editId=id;editParts=(t.parts||[{category:t.category,amount:-t.amount}]).map(p=>({...p}));drawParts()}
function drawParts(){const t=state.transactions.find(t=>t.id===editId);const sum=editParts.reduce((a,p)=>a+(Number(p.amount)||0),0);modal(`<h2>Rozdělit výdaj</h2><p class="small muted">${escapeHTML(t.name)} · celkem ${fmt(-t.amount)}</p><div id="partFields">${editParts.map((p,i)=>`<div class="card" style="background:#f8f6f9;padding:12px"><label class="field">Kategorie<select onchange="editParts[${i}].category=this.value">${categories.map(c=>`<option ${c===p.category?'selected':''}>${escapeHTML(c)}</option>`).join('')}</select></label><label class="field">Částka (Kč)<input type="number" min="0" step="0.01" value="${p.amount}" oninput="editParts[${i}].amount=Number(this.value);updatePartSum()"></label>${editParts.length>1?`<button class="ghost" onclick="editParts.splice(${i},1);drawParts()">Odebrat</button>`:''}</div>`).join('')}</div><div class="row" style="margin:15px 0"><b>Rozděleno</b><b id="partsSum">${fmt(sum)} / ${fmt(-t.amount)}</b></div><button class="button secondary full" onclick="editParts.push({category:categories[0],amount:0});drawParts()">+ Další kategorie</button><button class="button full" style="margin-top:9px" onclick="saveParts()">Uložit rozdělení</button><p class="note">Součet musí přesně odpovídat částce transakce. Výdaj se započítá pouze jednou.</p>`)}
function updatePartSum(){const t=state.transactions.find(t=>t.id===editId);const e=document.getElementById('partsSum');if(e)e.textContent=fmt(editParts.reduce((a,p)=>a+(Number(p.amount)||0),0))+' / '+fmt(-t.amount)}
function saveParts(){const t=state.transactions.find(t=>t.id===editId),sum=editParts.reduce((a,p)=>a+(Number(p.amount)||0),0);if(editParts.some(p=>!(p.amount>0))||Math.abs(sum+t.amount)>.005){toast('Součet musí odpovídat výdaji');return}const by={};editParts.forEach(p=>by[p.category]=(by[p.category]||0)+Number(p.amount));t.parts=Object.entries(by).map(([category,amount])=>({category,amount}));t.category=t.parts.length===1?t.parts[0].category:'Rozdělený výdaj';save();closeModal();render();toast('Rozdělení uloženo')}
function shops(){const opts=['Albert','BILLA','Tesco','Lidl','Kaufland','dm','Zoohit','Alza','Notino','Rohlík'];modal(`<h2>Oblíbené obchody</h2><p class="small muted">Hlídání bude upřednostňovat tvoje vybrané obchody.</p>${opts.map(s=>`<label class="row item"><span>${s}</span><input type="checkbox" class="switch shop" value="${s}" ${state.favorite.includes(s)?'checked':''}></label>`).join('')}<button class="button full" onclick="saveShops()">Uložit výběr</button>`)}function saveShops(){state.favorite=[...document.querySelectorAll('.shop:checked')].map(x=>x.value);save();closeModal();render();toast('Obchody uloženy')}function toast(s){let x=document.createElement('div');x.className='toast';x.textContent=s;document.body.appendChild(x);setTimeout(()=>x.remove(),2400)}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function fileToDataURL(f){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(f)})}
function toggleFavoriteFromList(id,itemId){const i=state.shoppingLists.find(l=>l.id===id)?.items.find(x=>x.id===itemId);if(!i)return;const pos=state.favoriteProducts.findIndex(x=>x.name.toLowerCase()===i.name.toLowerCase());if(pos>=0)state.favoriteProducts.splice(pos,1);else state.favoriteProducts.push({name:i.name,price:i.price??null});save();openShoppingList(id)}

function warrantyOverview(){const rs=state.receipts.filter(r=>r.warranty).sort((a,b)=>a.warranty.localeCompare(b.warranty));const now=new Date();now.setHours(0,0,0,0);modal(`<h2>🛡 Hlídání záruk</h2><p class="small muted">Přehled termínů podle uložených účtenek. Upozornění 30 dní před koncem uvidíš po otevření aplikace.</p>${rs.map(r=>{const days=Math.ceil((new Date(r.warranty+'T12:00:00')-now)/86400000);return `<div class="category" onclick="receiptDetail(${r.id})" style="cursor:pointer"><div class="grow"><b>${escapeHTML(r.warrantyProduct||r.name)}</b><div class="small muted">${escapeHTML(r.name)} · do ${escapeHTML(r.warranty)}</div></div><span class="pill">${days<0?'Po termínu':days<=30?days+' dní zbývá':'Aktivní'}</span></div>`}).join('')||'<p class="note">Zatím nemáš žádnou účtenku s nastaveným datem záruky.</p>'}`)}

async function exportBackup(){const button=document.querySelector('[onclick="exportBackup()"]');if(button){button.disabled=true;button.textContent='Připravuji zálohu včetně účtenek…'}try{const files={};for(const r of state.receipts){for(const p of r.photos||[]){if(!p.fileKey)continue;const data=await getReceiptFile(p.fileKey);if(typeof data!=='string')throw new Error('Chybí příloha '+p.name+' ('+p.fileKey+'). Záloha nebyla vytvořena.');files[p.fileKey]=data}}const blob=new Blob([JSON.stringify({format:'niloo-backup',version:2,exportedAt:new Date().toISOString(),data:state,receiptFiles:files})],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='niloo-uplna-zaloha-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);toast('Úplná záloha připravena ('+Object.keys(files).length+' příloh)')}catch(e){toast('Zálohu nelze dokončit: '+e.message);alert('Záloha nebyla vytvořena: '+e.message)}finally{if(button){button.disabled=false;button.textContent='↧ Stáhnout zálohu'}}}
async function importBackup(){const f=document.getElementById('backupFile')?.files?.[0];if(!f){toast('Vyber soubor JSON');return}if(f.size>150000000){toast('Záloha je příliš velká (limit 150 MB)');return}let b;try{b=JSON.parse(await f.text())}catch(e){toast('Neplatný soubor');return}if(b.format!=='niloo-backup'||!b.data||!Array.isArray(b.data.transactions)||!Array.isArray(b.data.receipts)){toast('Toto není platná záloha niloo.');return}const needed=b.data.receipts.flatMap(r=>(r.photos||[]).filter(p=>p.fileKey).map(p=>p.fileKey));if(b.version>=2&&needed.some(k=>typeof b.receiptFiles?.[k]!=='string')){alert('Záloha je neúplná: chybí některé soubory účtenek. Data nebyla změněna.');return}if(b.version<2&&!confirm('Tato starší záloha neobsahuje soubory účtenek. Obnovit pouze finanční data a metadata?'))return;if(!confirm('Opravdu obnovit zálohu? Současná data tohoto prohlížeče budou nahrazena.'))return;const old=state;try{if(b.version>=2){for(const [key,data] of Object.entries(b.receiptFiles||{}))await putReceiptFile(key,data)}state=b.data;save();if(!nilooCloudMode)location.reload();else{render();toast('Záloha obnovena; synchronizuji…')}}catch(e){state=old;save();alert('Obnova selhala: '+e.message+'. Původní finanční data byla ponechána.')}}

function savingsReview(){const items=state.receipts.flatMap(r=>r.items||[]);const sums={};items.forEach(i=>sums[i.category]=(sums[i.category]||0)+Number(i.price||0));modal(`<h2>Kde můžeš ušetřit?</h2><p class="small muted">Zatím ukazujeme součty rozpoznaných položek, nikoli odhadované úspory. Účtenky se nenačítají do výdajů automaticky, aby nedošlo k dvojímu započítání.</p>${Object.entries(sums).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div class="category"><b>${escapeHTML(c)}</b><b>${fmt(v)}</b></div>`).join('')||'<p class="note">Nejdřív nahraj účtenku a potvrď její položky.</p>'}`)}
// 3.5: OCR je volitelná funkce, běží v prohlížeči; knihovny se stahují až při použití.
const ocrCategories=['Potraviny','Drogerie','Domácnost','Alkohol','Cigarety a tabák','Mazlíčci','Ostatní'];
const ocrRules=[['Mazlíčci',/FRISKIES|PEDIGREE|GRANULE|KRMIVO|KOČK|PSÍ |PRO PSA|WHISKAS|PURINA|STELIVO/i],['Alkohol',/LAT[. ]?BIANCO|VÍNO|VINO |PIVO|VODKA|RUM\b|WHISKY|PROSECCO|SEKT\b|GIN\b/i],['Cigarety a tabák',/CIGARET|TABÁK|TABAK|IQOS|HEETS|VAPE|NIKOTIN/i],['Drogerie',/ŠAMPON|SAMPON|MÝDLO|MYDLO|PRACÍ|PRACI|AVIVÁŽ|AVIVAZ|DEODORANT|ZUBNÍ|ZUBNI|PASTA ZUB|SPRCHOV|KOSMET|KRÉM|KREM|DETERGENT|JAR\b/i],['Domácnost',/FINO ZEUS|PYTEL|PYTLE|SÁČKY|SACKY|HOUBIČK|HOUBICK|UTĚRK|UTERK|ALOBAL|FÓLIE|FOLIE|NÁDOB|NADOB|SVÍČK|SVICK|BATERIE/i]];
function guessReceiptCategory(name){const prev=state.receipts.flatMap(r=>r.items||[]).find(i=>i.name.toLocaleLowerCase('cs').trim()===name.toLocaleLowerCase('cs').trim());if(prev&&prev.category)return prev.category;return (ocrRules.find(([c,re])=>re.test(name))||['Ostatní'])[0]}
function loadScript(url){return new Promise((ok,no)=>{const e=document.createElement('script');e.src=url;e.onload=ok;e.onerror=()=>no(Error('Knihovna se nepodařila načíst'));document.head.append(e)})}
async function ocrImage(data){if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');const worker=await Tesseract.createWorker('ces+eng');try{const out=await worker.recognize(data);return out.data.text}finally{await worker.terminate()}}
async function extractPdfText(data){
 if(!window.pdfjsLib){await loadScript('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js');pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'}
 const bytes=Uint8Array.from(atob(data.split(',')[1]),c=>c.charCodeAt(0));
 const doc=await pdfjsLib.getDocument({data:bytes}).promise;let result='';
 for(let i=1;i<=Math.min(doc.numPages,5);i++){
  const page=await doc.getPage(i),txt=await page.getTextContent();
  const embedded=txt.items.map(x=>x.str).join(' ');
  const vp=page.getViewport({scale:3});const canvas=document.createElement('canvas');
  canvas.width=Math.round(vp.width);canvas.height=Math.round(vp.height);
  await page.render({canvasContext:canvas.getContext('2d'),viewport:vp}).promise;
  // Globus uses a two-column PDF: items on the left, card/DPH on the right.
  // Crop the merchandise column before OCR so payment amounts cannot be misread as products.
  if(/globus|duplik.t pokladn./i.test(embedded)){
   const crop=document.createElement('canvas');crop.width=Math.round(canvas.width*.49);crop.height=canvas.height;
   crop.getContext('2d').drawImage(canvas,0,0,crop.width,crop.height,0,0,crop.width,crop.height);
   result+='\nGLOBUS\n'+embedded+'\n'+await ocrImage(crop);
   crop.width=crop.height=1;
  }else{result+='\n'+embedded+'\n'+await ocrImage(canvas)}
  canvas.width=canvas.height=1;
 }
 return result;
}
function parseReceiptLines(text){
 const lines=text.split(/\r?\n/).map(s=>s.replace(/[|]/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);
 const out=[];let inItems=false, ended=false;
 const block=/CELKEM|TOTAL|ČÁSTKA CZK|CASTKA CZK|DPH|PLATEBN|POKLAD|AUTORIZ|PRODEJ|ÚSPOR|USTŘ|BONUS|DĚKUJ|VYPLAT|VRÁCEN|HOTOVOST|KARTA|TERMINÁL|TERMINAL|PODPIS|BANKA|ÚČET|UCET|SOUČET|SUMA|CZK:/i;
 for(const line of lines){
  if(/CELKEM|TOTAL|ČÁSTKA CZK|CASTKA CZK/i.test(line)){ended=true;continue}
  if(ended||block.test(line)||/Kč\/(?:kg|ks)|^\d+[,.]\d+\s*[x×]|^\d{8,14}$|^\d+[,.]\d+\s+(?:x|×)\s+\d/i.test(line))continue;
  // Remove optional printed count (2) and receipt's B / tax marker.
  const m=line.match(/^(.{3,90}?)\s+(?:\(\s*\d+(?:[,\.]\d+)?\s*\)\s*)?([0-9]{1,5}[,.][0-9]{2})\s*(?:[A-Z])?$/i);
  if(!m)continue;
  let name=m[1].replace(/\s+\(\s*\d+\s*\)$/,'').trim();
  const price=Number(m[2].replace(',','.'));
  if(!price||price>50000||/^[\d\s.,x×()]+$/.test(name)||/^[A-Z0-9]{10,}$/.test(name)||/^(?:DATUM|DUPLIK|GLOBUS|LIDL|POKLAD|PROVOZ|DUM |DŮM |ČÍSLO)/i.test(name))continue;
  out.push({name,price,category:guessReceiptCategory(name)});inItems=true;
 }
 return out;
}
function guessShopAndDate(text){const name=document.getElementById('receiptName');const date=document.getElementById('receiptDate');if(name&&!name.value.trim()){const shop= /LIDL/i.test(text)?'Lidl':/GLOBUS/i.test(text)?'Globus':/ALBERT/i.test(text)?'Albert':/KAUFLAND/i.test(text)?'Kaufland':/BILLA/i.test(text)?'BILLA':null;if(shop)name.value=shop}const m=text.match(/(?:datum|date|dne)?\s*[: ]*([0-3]?\d)[.\/ -]([01]?\d)[.\/ -](20\d{2})/i);if(date&&m){const d=`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;if(!Number.isNaN(new Date(d).getTime()))date.value=d}}

function ocrStatus(t){const e=document.getElementById('ocrStatus');if(e)e.textContent=t}
function setOCRProgress(stage){const p=document.getElementById('ocrProgress'),s=document.getElementById('ocrStage'),b=document.getElementById('ocrRetry');if(p)p.style.display=stage?'block':'none';if(s&&stage)s.textContent=stage;if(b){b.disabled=!!stage;b.style.display=stage?'none':(pendingPhotos.length?'block':'none');b.textContent='↻ Zkusit rozpoznat znovu'}const save=document.getElementById('receiptSaveButton');if(save)save.disabled=!!stage}
async function analyzeReceipt(){if(receiptOCRBusy)return;if(!pendingPhotos.length){toast('Nejdřív vyber účtenku');return}receiptOCRBusy=true;pendingItems=[];pendingOCRText='';setOCRProgress('Čtu účtenku… první spuštění může trvat déle.');ocrStatus('');try{let text='';for(let i=0;i<Math.min(3,pendingPhotos.length);i++){const f=pendingPhotos[i];setOCRProgress('Rozpoznávám text ze souboru '+(i+1)+' z '+Math.min(3,pendingPhotos.length)+'…');text+='\n'+(f.type==='pdf'?await extractPdfText(f.data):await ocrImage(f.data))}pendingOCRText=text;setOCRProgress('Hledám produkty, ceny a navrhuji kategorie…');guessShopAndDate(text);if(!document.getElementById('receiptName')?.value.trim()&&pendingPhotos.some(f=>/globus/i.test(f.name)))document.getElementById('receiptName').value='Globus';pendingItems=parseReceiptLines(text);receiptExpandedCategory=null;renderOCRReview();updateReceiptDateDisplay();ocrStatus(pendingItems.length?'Hotovo: '+pendingItems.length+' návrhů položek. Zkontroluj názvy, ceny a součet.':'Hotovo, ale položky se nepodařilo spolehlivě rozpoznat. Zkontroluj rozpoznaný text a případně doplň položky ručně.')}catch(e){ocrStatus('Rozpoznávání se nezdařilo ('+e.message+'). Položky lze zadat ručně.');renderOCRReview()}finally{receiptOCRBusy=false;setOCRProgress('')}}

let receiptExpandedCategory=null;
function receiptMoney(n){return Number(n||0).toLocaleString('cs-CZ',{minimumFractionDigits:2,maximumFractionDigits:2})+' Kč'}
function receiptCategoryIcon(c){return ({'Potraviny':'🛒','Drogerie':'🧴','Domácnost':'⌂','Alkohol':'🍷','Cigarety a tabák':'◌','Mazlíčci':'🐾','Ostatní':'◇'})[c]||'◇'}
function renderOCRReview(){const e=document.getElementById('ocrReview');if(!e)return;const groups=ocrCategories.map(c=>({category:c,entries:pendingItems.map((p,i)=>({...p,index:i})).filter(p=>p.category===c)})).filter(g=>g.entries.length);const sum=pendingItems.reduce((a,p)=>a+(Number(p.price)||0),0);e.innerHTML=`<div class="niloo-items-head"><b>Položky nákupu</b><span class="small muted">${pendingItems.length} ${pendingItems.length===1?'položka':'položek'}</span></div>${groups.length?`<div class="niloo-category-list">${groups.map(g=>`<div class="niloo-group"><button class="niloo-group-head" onclick="toggleReceiptGroup('${escapeHTML(g.category)}')"><span class="niloo-group-icon">${receiptCategoryIcon(g.category)}</span><span class="niloo-group-label"><b>${escapeHTML(g.category)}</b><small>${g.entries.length} položek</small></span><strong>${receiptMoney(g.entries.reduce((s,p)=>s+Number(p.price||0),0))}</strong><span class="niloo-chevron">${receiptExpandedCategory===g.category?'⌃':'⌄'}</span></button>${receiptExpandedCategory===g.category?`<div class="niloo-group-items">${g.entries.map(p=>`<button class="niloo-product-row" onclick="editPendingReceiptItem(${p.index})"><span>${escapeHTML(p.name||'Nová položka')}</span><span>${receiptMoney(p.price)} <span style="color:#a395af">✎</span></span></button>`).join('')}</div>`:''}</div>`).join('')}</div>`:`<div class="niloo-empty-items">${pendingPhotos.length?'Položky se nepodařilo rozpoznat.':'Po nahrání účtenky se zde objeví kategorie.'}</div>`}<button class="ghost niloo-add-item" onclick="addPendingReceiptItem()">+ Přidat položku</button><div class="niloo-receipt-total"><span>Součet položek</span><b>${receiptMoney(sum)}</b></div>`}
function toggleReceiptGroup(c){receiptExpandedCategory=receiptExpandedCategory===c?null:c;renderOCRReview()}
function addPendingReceiptItem(){pendingItems.push({name:'',price:0,category:'Ostatní'});editPendingReceiptItem(pendingItems.length-1)}
function editPendingReceiptItem(i){const p=pendingItems[i];if(!p)return;const root=document.getElementById('receiptItemEditor');if(root)root.remove();const div=document.createElement('div');div.id='receiptItemEditor';div.className='niloo-editor-backdrop';div.innerHTML=`<div class="niloo-editor" role="dialog" aria-modal="true" aria-label="Upravit položku"><div class="row" style="justify-content:space-between"><h3>Upravit položku</h3><button class="ghost" onclick="closePendingReceiptEditor()">×</button></div><label class="field">Název<input id="nilooEditName" value="${escapeHTML(p.name)}"></label><label class="field">Cena (Kč)<input id="nilooEditPrice" inputmode="decimal" type="number" min="0" step="0.01" value="${Number(p.price)||0}"></label><label class="field">Kategorie<select id="nilooEditCategory">${ocrCategories.map(c=>`<option value="${escapeHTML(c)}" ${p.category===c?'selected':''}>${escapeHTML(c)}</option>`).join('')}</select></label><button class="button full" onclick="savePendingReceiptItem(${i})">Uložit změny</button><button class="ghost full" style="margin-top:8px" onclick="removePendingReceiptItem(${i})">Odstranit položku</button></div>`;document.body.appendChild(div)}

function savePendingReceiptItem(i){const name=document.getElementById('nilooEditName').value.trim(),price=Number(document.getElementById('nilooEditPrice').value),category=document.getElementById('nilooEditCategory').value;if(!name||!Number.isFinite(price)||price<0){toast('Vyplň název a platnou cenu');return}pendingItems[i]={name,price,category};receiptExpandedCategory=category;closePendingReceiptEditor();renderOCRReview()}

function receiptItems(id){const r=state.receipts.find(x=>x.id===id);if(!r)return;modal(`<h2>Položky účtenky</h2><p class="small muted">${escapeHTML(r.name)} · ${r.date}</p>${(r.items||[]).map((p,i)=>`<div class="category" style="display:block"><b>${escapeHTML(p.name)}</b><div class="row"><span>${Number(p.price).toLocaleString('cs-CZ',{minimumFractionDigits:2})} Kč</span><select id="ri${i}" onchange="changeReceiptItemCategory(${id},${i},this.value)">${ocrCategories.map(c=>`<option ${p.category===c?'selected':''}>${c}</option>`).join('')}</select></div></div>`).join('')||'<p class="note">Tento doklad zatím nemá rozpoznané položky.</p>'}<button class="button secondary full" onclick="receiptDetail(${id})">Zpět</button>`)}
function changeReceiptItemCategory(id,i,c){const r=state.receipts.find(x=>x.id===id);if(!r||!r.items?.[i])return;r.items[i].category=c;save();toast('Kategorie uložena')}
function monthlyBreakdown(){const dated=state.transactions.filter(t=>/^\d{4}-\d{2}-\d{2}$/.test(t.date||''));const months=[...new Set(dated.map(t=>t.date.slice(0,7)))].sort().reverse();modal(`<h2>Výdaje podle měsíců</h2><p class="small muted">Pro tento přehled musí mít transakce skutečné datum. Ukázkové transakce s datem „Včera“ se nezapočítávají.</p>${months.map(m=>`<button class="category" style="width:100%" onclick="monthDetail('${m}')"><b>${m}</b><span>›</span></button>`).join('')||'<p class="note">Zatím nemáš transakce s přesným datem. Přidáme je při importu bankovního výpisu.</p>'}`)}
function monthDetail(month){const tx=state.transactions.filter(t=>t.date?.startsWith(month)&&t.amount<0);const cats={};tx.forEach(t=>(t.parts||[{category:t.category,amount:-t.amount}]).forEach(p=>cats[p.category]=(cats[p.category]||0)+p.amount));modal(`<h2>${month}</h2>${Object.entries(cats).map(([c,v])=>`<div class="category"><div class="grow"><b>${escapeHTML(c)}</b><div class="small muted">${tx.filter(t=>(t.parts||[{category:t.category}]).some(p=>p.category===c)).map(t=>escapeHTML(t.name)).join(', ')}</div></div><b>${fmt(v)}</b></div>`).join('')||'<p class="note">Žádné výdaje</p>'}<button class="button secondary full" onclick="monthlyBreakdown()">Zpět</button>`)}

render();

async function nilooFlushCloud(){if(nilooCloudSaving||!nilooCloudMode||!nilooCloudUserId||!nilooClient)return;nilooCloudSaving=true;const uid=nilooCloudUserId,version=nilooCloudVersion,payload=structuredClone(state);try{const {error}=await nilooClient.from('user_data').upsert({user_id:uid,data:payload,updated_at:new Date().toISOString()},{onConflict:'user_id'});if(error)throw error;if(version!==nilooCloudVersion&&uid===nilooCloudUserId)nilooScheduleCloudSave()}catch(e){console.error('niloo sync:',e);toast('Uložení do cloudu selhalo. Zkus to znovu.');}finally{nilooCloudSaving=false}}
async function nilooLoadCloud(user){if(nilooDemoViewing)nilooReturnPersonal();if(!nilooClient||!user||nilooCloudUserId===user.id)return;clearTimeout(nilooCloudTimer);nilooCloudMode=false;nilooCloudLoading=true;nilooCloudUserId=null;nilooApplyState(nilooFreshState());try{const {data,error}=await nilooClient.from('user_data').select('data').eq('user_id',user.id).maybeSingle();if(error)throw error;if(nilooUser?.id!==user.id)return;nilooApplyState(data?.data&&Array.isArray(data.data.transactions)?data.data:nilooFreshState());nilooCloudUserId=user.id;nilooCloudMode=true;nilooCloudBadge();if(!data){nilooCloudLoading=false;nilooScheduleCloudSave()}}catch(e){console.error('niloo load:',e);nilooCloudMode=false;nilooCloudUserId=null;nilooShowWelcome(true);const note=document.getElementById('nilooWelcomeNote');note.textContent='Osobní data se nepodařilo načíst. Zkus stránku obnovit. Nic jsme nepřepsali.';note.classList.add('show')}finally{nilooCloudLoading=false}}

async function nilooInitAuth(){try{if(!window.supabase?.createClient)throw Error('Knihovnu Supabase se nepodařilo načíst');nilooClient=window.supabase.createClient(NILOO_SUPABASE_URL,NILOO_SUPABASE_KEY,{auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});nilooClient.auth.onAuthStateChange((_event,session)=>{const previous=nilooUser?.id;nilooUser=session?.user||null;if(!nilooUser&&previous)nilooLeaveCloud();nilooUpdateAccount();if(nilooUser)setTimeout(()=>nilooLoadCloud(nilooUser),0);if(_event==='PASSWORD_RECOVERY')setTimeout(nilooPromptPasswordSetup,0)});const {data,error}=await nilooClient.auth.getSession();if(error)throw error;nilooUser=data.session?.user||null;nilooUpdateAccount();if(nilooUser)await nilooLoadCloud(nilooUser)}catch(e){console.error('niloo auth:',e);const note=document.getElementById('nilooWelcomeNote');note.textContent='Přihlášení je momentálně nedostupné. Můžeš se zatím podívat bez účtu.';note.classList.add('show')}}
